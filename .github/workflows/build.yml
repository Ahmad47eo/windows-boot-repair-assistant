name: Build BootRepairAssistant2
on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet test tests/BootRepairAssistant2.Tests -c Release
      - run: dotnet publish src/BootRepairAssistant2/BootRepairAssistant2.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: BootRepairAssistant2-win-x64
          path: publish/BootRepairAssistant2.exe
